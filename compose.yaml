x-game-service: &game-service
  image: living-world-rpg:local
  build: .
  restart: unless-stopped
  volumes:
    - game_saves:/data

services:
  web:
    <<: *game-service
    command: ["python", "web_game.py"]
    environment:
      WEB_BIND: 0.0.0.0
      WEB_GAME_DB: /data/living-world-web.sqlite3
      WEB_PUBLIC_ORIGIN: https://${GAME_DOMAIN:?Укажи GAME_DOMAIN в .env}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 3

  bot:
    <<: *game-service
    command: ["python", "bot.py"]
    environment:
      GAME_DB: /data/living-world.sqlite3
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Укажи TELEGRAM_BOT_TOKEN в .env}

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Укажи GAME_DOMAIN в .env}
      NO_PROXY: "web,localhost,127.0.0.1"
      no_proxy: "web,localhost,127.0.0.1"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  game_saves:
  proxy_data:
  proxy_config:
